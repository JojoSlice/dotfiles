# Default shell
set -g default-shell /usr/bin/zsh

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Reduce escape time for faster response in nvim
set -sg escape-time 10

# Enable focus events for autoread in nvim
set -g focus-events on

# Enable clipboard integration
set -g set-clipboard on

# Solarized Osaka theme colors
base="#00141a"
surface="#002d38"
overlay="#073541"
muted="#586e74"
subtle="#9fabad"
text="#adb8b8"
blue="#278bd3"
cyan="#2aa298"
green="#859900"
yellow="#b38600"
orange="#ca4c16"
red="#dc312e"
magenta="#d33682"
violet="#6d72c5"

# Status bar
set -g status-position bottom
set -g status-style "bg=$base,fg=$subtle"
set -g status-left-length 40
set -g status-right-length 80
set -g status-justify centre

# Left: empty
set -g status-left ""

# Center: session name and windows
set -g window-status-format "#[fg=$muted] #I:#W "
set -g window-status-current-format "#[fg=$base,bg=$cyan,bold] #I:#W #[fg=$cyan,bg=$base]"
set -g window-status-separator ""

# Prefix session name before windows
set -ga status-left "#[fg=$base,bg=$blue,bold] #S #[fg=$blue,bg=$base] "

# Right: date and time
set -g status-right " #[fg=$muted]%Y-%m-%d #[fg=$subtle]│ #[fg=$text,bold]%H:%M "

# Pane borders
set -g pane-border-style "fg=$overlay"
set -g pane-active-border-style "fg=$blue"

# Messages
set -g message-style "bg=$overlay,fg=$text"
set -g message-command-style "bg=$overlay,fg=$text"

# Custom keybindings
bind t new-window
bind w kill-window
bind Tab next-window
bind BTab previous-window
bind v split-window -h
bind s split-window -v
